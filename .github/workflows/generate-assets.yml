name: Generate Obsidian Editor assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate assets from master logo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: rebrand/obsidian

      - name: Verify master PNG exists
        run: |
          if [ ! -f "void_icons/obsidian-editor-logo.png" ]; then
            echo "ERROR: Master logo was not found."
            exit 1
          fi

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Generate Obsidian Editor image assets
        run: |
          set -e

          magick void_icons/obsidian-editor-logo.png \
            -resize 1024x1024 \
            void_icons/cubecircled.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 872x872 \
            void_icons/logo_cube_noshadow.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 1024x1024 \
            void_icons/slice_of_void.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 1024x1024 \
            src/vs/workbench/browser/parts/editor/media/slice_of_void.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 872x872 \
            src/vs/workbench/browser/parts/editor/media/void_cube_noshadow.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 16x16 \
            /tmp/icon-16.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 24x24 \
            /tmp/icon-24.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 32x32 \
            /tmp/icon-32.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 48x48 \
            /tmp/icon-48.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 256x256 \
            /tmp/icon-256.png

          magick \
            /tmp/icon-16.png \
            /tmp/icon-24.png \
            /tmp/icon-32.png \
            /tmp/icon-48.png \
            /tmp/icon-256.png \
            void_icons/code.ico

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            void_icons/code.ico \
            void_icons/cubecircled.png \
            void_icons/logo_cube_noshadow.png \
            void_icons/slice_of_void.png \
            src/vs/workbench/browser/parts/editor/media/slice_of_void.png \
            src/vs/workbench/browser/parts/editor/media/void_cube_noshadow.png

          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "chore(branding): generate Obsidian Editor assets"
            git push origin rebrand/obsidian
          fi

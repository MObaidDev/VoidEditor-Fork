name: Generate Obsidian Editor assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rebrand/obsidian

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate branding assets
        run: |
          magick void_icons/obsidian-editor-logo.png \
            -resize 1024x1024 \
            void_icons/cubecircled.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 872x872 \
            void_icons/logo_cube_noshadow.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 1024x1024 \
            void_icons/slice_of_void.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 1024x1024 \
            src/vs/workbench/browser/parts/editor/media/slice_of_void.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 872x872 \
            src/vs/workbench/browser/parts/editor/media/void_cube_noshadow.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 16x16 /tmp/icon16.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 24x24 /tmp/icon24.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 32x32 /tmp/icon32.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 48x48 /tmp/icon48.png

          magick void_icons/obsidian-editor-logo.png \
            -resize 256x256 /tmp/icon256.png

          magick \
            /tmp/icon16.png \
            /tmp/icon24.png \
            /tmp/icon32.png \
            /tmp/icon48.png \
            /tmp/icon256.png \
            void_icons/code.ico

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            void_icons/code.ico \
            void_icons/cubecircled.png \
            void_icons/logo_cube_noshadow.png \
            void_icons/slice_of_void.png \
            src/vs/workbench/browser/parts/editor/media/slice_of_void.png \
            src/vs/workbench/browser/parts/editor/media/void_cube_noshadow.png

          git diff --cached --quiet || \
          git commit -m "Generate Obsidian Editor branding assets"

          git push origin rebrand/obsidian
